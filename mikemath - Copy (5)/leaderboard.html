<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng xếp hạng - MikeMath</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==========================================================================
           Leaderboard Custom Flat Layered Styles
           ========================================================================== */
        
        /* Podium TOP 3 Layout */
        .podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .podium-card {
            background-color: var(--surface-card);
            border: 2.5px solid var(--text-main);
            border-radius: var(--radius-md);
            padding: 20px 16px;
            text-align: center;
            box-shadow: 5px 5px 0px var(--text-main);
            flex: 1;
            max-width: 220px;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .podium-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px var(--text-main);
        }

        /* Thứ tự bệ đứng: Top 2 -> Top 1 -> Top 3 */
        .podium-card.rank-1 {
            order: 2;
            transform: translateY(-16px);
            border-color: var(--text-main);
            background: linear-gradient(180deg, #fef9c3 0%, #ffffff 100%);
            box-shadow: 6px 6px 0px #ca8a04;
        }
        .podium-card.rank-1:hover {
            transform: translateY(-18px) translate(-2px, -2px);
            box-shadow: 8px 8px 0px #ca8a04;
        }

        .podium-card.rank-2 {
            order: 1;
            background: linear-gradient(180deg, #f1f5f9 0%, #ffffff 100%);
            box-shadow: 5px 5px 0px #64748b;
        }

        .podium-card.rank-3 {
            order: 3;
            background: linear-gradient(180deg, #ffedd5 0%, #ffffff 100%);
            box-shadow: 5px 5px 0px #c2410c;
        }

        .crown-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
            line-height: 1;
        }
        .rank-1 .crown-icon { color: #ca8a04; }
        .rank-2 .crown-icon { color: #64748b; }
        .rank-3 .crown-icon { color: #c2410c; }

        .podium-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 10px;
            border: 2px solid var(--text-main);
            background-color: var(--surface-subtle);
            box-shadow: 2px 2px 0px var(--text-main);
        }

        .podium-username {
            font-weight: 800;
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .podium-score {
            display: inline-block;
            font-weight: 900;
            color: var(--primary);
            font-size: 1.15rem;
            background-color: var(--primary-light);
            padding: 4px 12px;
            border-radius: 50px;
            border: 1.5px solid var(--primary);
        }

        /* Leaderboard Table / List (Rank 4+) */
        .board-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .board-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: #ffffff;
            border: 2px solid var(--text-main);
            border-radius: var(--radius-md);
            box-shadow: 3px 3px 0px var(--text-main);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
            margin-bottom: 10px;
        }

        .board-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--text-main);
            background-color: #f8fafc;
        }

        .item-rank {
            font-weight: 900;
            font-size: 1.1rem;
            width: 45px;
            color: var(--text-muted);
            text-align: center;
        }

        .item-user {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .item-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--text-main);
            background-color: var(--surface-subtle);
        }

        .item-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
        }

        .item-score {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--primary);
        }

        /* Highlighting người dùng hiện tại */
        .board-item.current-user-highlight {
            background-color: #eff6ff;
            border-color: var(--primary);
            box-shadow: 4px 4px 0px var(--primary);
        }

        .loading-state, .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .podium {
                flex-direction: column;
                align-items: center;
            }
            .podium-card {
                width: 100%;
                max-width: 100%;
            }
            .podium-card.rank-1 {
                order: 1;
                transform: none;
            }
            .podium-card.rank-2 { order: 2; }
            .podium-card.rank-3 { order: 3; }
            
            .podium-card.rank-1:hover {
                transform: translate(-2px, -2px);
            }
        }
    </style>
</head>
<body>

    <!-- Navbar Dynamic Load -->
    <div id="navbar"></div>

    <main class="container problems-page">

        <!-- ================= Header ================= -->
        <section class="page-header nohover card">
            <div>
                <h1><i class="fa-solid fa-trophy" style="color: var(--primary);"></i> Bảng xếp hạng</h1>
                <p>Vinh danh những học sinh có điểm tích lũy cao nhất MikeMath.</p>
            </div>
        </section>

        <!-- ================= Top 3 Podium ================= -->
        <section class="podium" id="podiumContainer" style="display: none;">
            <!-- Render TOP 2, TOP 1, TOP 3 bằng JS -->
        </section>

        <!-- ================= Leaderboard List (Rank 4+) ================= -->
        <section id="boardCard" class="card nohover" style="padding: 20px;">
            <div id="loadingBox" class="loading-state">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 12px;">Đang tải bảng xếp hạng...</p>
            </div>

            <div id="boardList" class="board-list" style="display: none;"></div>

            <div id="emptyBox" class="empty-state" style="display: none;">
                <i class="fa-solid fa-ghost fa-2x"></i>
                <p style="margin-top: 12px;">Chưa có dữ liệu bảng xếp hạng.</p>
            </div>
        </section>

    </main>

    <!-- Footer Dynamic Load -->
    <div id="footer"></div>

    <script src="js/load-components.js"></script>
    <script type="module" src="js/leaderboard.js"></script>

</body>
</html>
